<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="60%" stop-color="#DBEAFE"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="buildingMain" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Sky & Ambient Background -->
  <rect width="600" height="400" rx="20" fill="url(#skyGrad)"/>
  <circle cx="500" cy="80" r="45" fill="#FEF08A" fill-opacity="0.6"/>

  <!-- Clouds -->
  <path d="M 60 80 Q 75 60 95 65 Q 115 50 140 65 Q 160 55 175 75 Q 190 90 170 100 H 65 Q 50 95 60 80 Z" fill="#FFFFFF" fill-opacity="0.8"/>
  <path d="M 380 90 Q 395 75 410 80 Q 425 65 445 80 Q 460 75 470 90 Q 480 105 465 110 H 385 Q 370 105 380 90 Z" fill="#FFFFFF" fill-opacity="0.7"/>

  <!-- School Ground -->
  <rect x="0" y="320" width="600" height="80" fill="#E2E8F0"/>
  <rect x="0" y="340" width="600" height="60" fill="#CBD5E1"/>
  <!-- Courtyard Path -->
  <polygon points="260,320 340,320 390,400 210,400" fill="#94A3B8"/>

  <!-- Trees (Left & Right) -->
  <ellipse cx="60" cy="280" rx="35" ry="50" fill="#10B981"/>
  <ellipse cx="45" cy="290" rx="25" ry="35" fill="#059669"/>
  <rect x="55" y="315" width="10" height="30" fill="#78350F"/>

  <ellipse cx="540" cy="275" rx="38" ry="55" fill="#10B981"/>
  <ellipse cx="560" cy="290" rx="26" ry="36" fill="#047857"/>
  <rect x="535" y="315" width="10" height="30" fill="#78350F"/>

  <!-- Main School Building (Center Wing) -->
  <rect x="230" y="140" width="140" height="180" fill="url(#buildingMain)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Clock Tower Roof -->
  <polygon points="300,70 230,140 370,140" fill="url(#roofGrad)"/>
  <!-- School Flagpole -->
  <line x1="300" y1="40" x2="300" y2="70" stroke="#64748B" stroke-width="2.5"/>
  <polygon points="300,42 325,49 300,56" fill="#DC2626"/>

  <!-- Clock Face -->
  <circle cx="300" cy="115" r="16" fill="#FFFFFF" stroke="#1E3A8A" stroke-width="2"/>
  <line x1="300" y1="115" x2="300" y2="105" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="115" x2="308" y2="115" stroke="#1E293B" stroke-width="2" stroke-linecap="round"/>

  <!-- Left Wing -->
  <rect x="110" y="190" width="120" height="130" fill="url(#buildingMain)" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="100,190 235,190 230,170 105,170" fill="url(#roofGrad)"/>
  <!-- Left Wing Windows -->
  <rect x="125" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="160" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="195" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="125" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="160" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="195" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>

  <!-- Right Wing -->
  <rect x="370" y="190" width="120" height="130" fill="url(#buildingMain)" stroke="#CBD5E1" stroke-width="2"/>
  <polygon points="365,190 500,190 495,170 370,170" fill="url(#roofGrad)"/>
  <!-- Right Wing Windows -->
  <rect x="385" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="420" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="455" y="210" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="385" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="420" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>
  <rect x="455" y="255" width="22" height="28" rx="3" fill="#60A5FA"/>

  <!-- Center Wing Portal & Grand Entrance -->
  <rect x="270" y="245" width="60" height="75" rx="8" fill="#1E293B"/>
  <path d="M 270 270 Q 300 245 330 270 V 320 H 270 Z" fill="#2563EB" opacity="0.85"/>
  <line x1="300" y1="260" x2="300" y2="320" stroke="#FFFFFF" stroke-width="2"/>
  <!-- Entrance Signboard -->
  <rect x="250" y="160" width="100" height="26" rx="6" fill="#1D4ED8"/>
  <text x="300" y="177" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1">SMART SCHOOL</text>

  <!-- High-Tech Biometric Scanner Kiosk at Entrance -->
  <rect x="235" y="275" width="14" height="42" rx="3" fill="#0F172A"/>
  <rect x="233" y="278" width="18" height="20" rx="3" fill="#0284C7"/>
  <circle cx="242" cy="288" r="4" fill="#38BDF8"/>
  <circle cx="242" cy="288" r="8" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Student Figures approaching -->
  <circle cx="210" cy="335" r="7" fill="#FBD5BD"/>
  <rect x="204" y="342" width="12" height="22" rx="3" fill="#2563EB"/>
  <circle cx="370" cy="340" r="7" fill="#FBD5BD"/>
  <rect x="364" y="347" width="12" height="22" rx="3" fill="#059669"/>
</svg>

