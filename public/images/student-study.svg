<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="ss-bg" x1="0" y1="0" x2="500" y2="350" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>
    <linearGradient id="ss-blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="ss-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>
    <filter id="ss-shadow" x="-10" y="-10" width="520" height="370" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1E3A8A" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="350" rx="20" fill="url(#ss-bg)"/>

  <!-- Subtle Modern Geometric Accents -->
  <circle cx="430" cy="70" r="45" fill="#3B82F6" fill-opacity="0.1"/>
  <circle cx="70" cy="270" r="60" fill="#2563EB" fill-opacity="0.08"/>
  <path d="M 380 20 L 410 40 L 390 60 Z" fill="#60A5FA" fill-opacity="0.3"/>

  <!-- Left Side: Student Schedule & Performance Card Preview -->
  <g transform="translate(40, 50)" filter="url(#ss-shadow)">
    <rect width="180" height="230" rx="16" fill="url(#ss-card)" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Card Header -->
    <rect width="180" height="42" rx="16" fill="#2563EB"/>
    <text x="20" y="26" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700">TARGET &amp; STATISTIK</text>
    
    <!-- Mini Metric 1 -->
    <rect x="18" y="58" width="144" height="48" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <circle cx="38" cy="82" r="12" fill="#2563EB"/>
    <path d="M 34 82 L 37 85 L 43 79" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" fill="none"/>
    <text x="58" y="77" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="600">Kehadiran Bulan Ini</text>
    <text x="58" y="93" fill="#0F172A" font-family="sans-serif" font-size="13" font-weight="800">100% (24 Hari)</text>

    <!-- Mini Metric 2 -->
    <rect x="18" y="116" width="144" height="48" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
    <circle cx="38" cy="140" r="12" fill="#10B981"/>
    <text x="38" y="144" fill="#FFFFFF" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">⚡</text>
    <text x="58" y="135" fill="#64748B" font-family="sans-serif" font-size="9" font-weight="600">Presensi Rata-Rata</text>
    <text x="58" y="151" fill="#0F172A" font-family="sans-serif" font-size="12" font-weight="800">06:42 WIB (Aman)</text>

    <!-- Mini Metric 3 / QR Badge -->
    <rect x="18" y="174" width="144" height="48" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="28" y="184" width="28" height="28" rx="4" fill="#0F172A"/>
    <rect x="33" y="189" width="6" height="6" fill="#38BDF8"/>
    <rect x="45" y="189" width="6" height="6" fill="#FFFFFF"/>
    <rect x="33" y="201" width="6" height="6" fill="#FFFFFF"/>
    <rect x="45" y="201" width="6" height="6" fill="#38BDF8"/>
    <text x="64" y="196" fill="#0F172A" font-family="sans-serif" font-size="10" font-weight="700">Digital ID Card</text>
    <text x="64" y="210" fill="#10B981" font-family="sans-serif" font-size="9" font-weight="600">● Terverifikasi AI</text>
  </g>

  <!-- Right Side: Cheerful Student Character -->
  <g transform="translate(250, 40)">
    <!-- Floor Shadow -->
    <ellipse cx="120" cy="275" rx="65" ry="12" fill="#64748B" fill-opacity="0.25"/>

    <!-- School Backpack behind shoulders -->
    <rect x="65" y="115" width="30" height="75" rx="14" fill="#EA580C"/>
    <rect x="60" y="130" width="10" height="40" rx="5" fill="#C2410C"/>

    <!-- Body (School Uniform: White Shirt + Blue Accents) -->
    <path d="M 85 110 Q 120 100, 155 110 L 165 210 L 75 210 Z" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Tie / Collar -->
    <polygon points="112,110 128,110 125,145 120,152 115,145" fill="#2563EB"/>
    <polygon points="106,108 116,120 98,124" fill="#E2E8F0"/>
    <polygon points="134,108 124,120 142,124" fill="#E2E8F0"/>
    
    <!-- Pants (Navy) -->
    <rect x="85" y="210" width="32" height="65" rx="4" fill="#1E293B"/>
    <rect x="123" y="210" width="32" height="65" rx="4" fill="#1E293B"/>
    <!-- Shoes -->
    <ellipse cx="101" cy="275" rx="20" ry="8" fill="#0F172A"/>
    <ellipse cx="139" cy="275" rx="20" ry="8" fill="#0F172A"/>

    <!-- Neck & Head -->
    <rect x="113" y="90" width="14" height="15" fill="#FBBF24" rx="4"/>
    <circle cx="120" cy="65" r="26" fill="#FBBF24"/>
    
    <!-- Hair (Modern Stylish Teen Cut) -->
    <path d="M 94 60 Q 120 30, 146 60 Q 140 40, 120 38 Q 100 40, 94 60 Z" fill="#1E293B"/>
    <path d="M 96 58 Q 104 70, 98 75 Q 105 65, 108 55 Z" fill="#1E293B"/>
    <path d="M 144 58 Q 136 70, 142 75 Q 135 65, 132 55 Z" fill="#1E293B"/>

    <!-- Eyes (Bright & Smiling) -->
    <circle cx="111" cy="63" r="3" fill="#1E293B"/>
    <circle cx="129" cy="63" r="3" fill="#1E293B"/>
    <!-- Friendly Smile -->
    <path d="M 112 74 Q 120 82, 128 74" stroke="#78350F" stroke-width="2" stroke-linecap="round" fill="none"/>

    <!-- Arms & Hands holding Smart Tablet -->
    <!-- Left Arm -->
    <path d="M 85 115 Q 70 150, 95 165" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
    <!-- Right Arm -->
    <path d="M 155 115 Q 170 150, 145 165" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>
    <circle cx="95" cy="165" r="7" fill="#FBBF24"/>
    <circle cx="145" cy="165" r="7" fill="#FBBF24"/>

    <!-- Modern Tablet (Screen Glow) -->
    <rect x="90" y="145" width="60" height="45" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="url(#ss-shadow)"/>
    <rect x="94" y="149" width="52" height="37" rx="3" fill="#2563EB"/>
    <!-- Tablet Screen UI Elements -->
    <circle cx="120" cy="162" r="6" fill="#10B981"/>
    <path d="M 118 162 L 120 164 L 123 160" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <rect x="100" y="172" width="40" height="3" rx="1.5" fill="#FFFFFF"/>
    <rect x="106" y="178" width="28" height="3" rx="1.5" fill="#93C5FD"/>
  </g>

  <!-- Floating Achievement Notification Pill -->
  <g transform="translate(260, 20)" filter="url(#ss-shadow)">
    <rect width="180" height="36" rx="18" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <circle cx="20" cy="18" r="11" fill="#10B981"/>
    <text x="20" y="22" fill="#FFFFFF" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">★</text>
    <text x="38" y="22" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">Disiplin Tinggi: 100%</text>
  </g>
</svg>

