<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGlow" x1="100" y1="50" x2="500" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#DBEAFE" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="uniformGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="vestGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="scanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#2563EB" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <rect width="600" height="500" rx="24" fill="url(#bgGlow)"/>
  <circle cx="480" cy="90" r="80" fill="#2563EB" fill-opacity="0.04"/>
  <circle cx="90" cy="420" r="110" fill="#06B6D4" fill-opacity="0.05"/>

  <!-- Kiosk Scanner Stand (Background) -->
  <rect x="360" y="70" width="190" height="340" rx="20" fill="#0F172A" filter="url(#cardShadow)"/>
  <rect x="368" y="78" width="174" height="260" rx="14" fill="#090E17"/>
  
  <!-- Kiosk Camera Lens -->
  <circle cx="455" cy="105" r="14" fill="#1E293B"/>
  <circle cx="455" cy="105" r="8" fill="#0284C7"/>
  <circle cx="453" cy="103" r="3" fill="#67E8F9"/>

  <!-- Scanning Screen Hologram -->
  <rect x="382" y="130" width="146" height="185" rx="10" fill="#0F1C3A" stroke="#1D4ED8" stroke-width="1.5"/>
  <path d="M 390 140 H 405 V 155" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 520 140 H 505 V 155" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 390 305 H 405 V 290" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 520 305 H 505 V 290" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Face Recognition Target Mesh on Screen -->
  <ellipse cx="455" cy="210" rx="36" ry="46" fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="442" cy="198" r="3" fill="#38BDF8"/>
  <circle cx="468" cy="198" r="3" fill="#38BDF8"/>
  <path d="M 455 208 V 218 H 450" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 445 234 Q 455 242 465 234" fill="none" stroke="#22D3EE" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Laser Beam -->
  <line x1="385" y1="210" x2="525" y2="210" stroke="#38BDF8" stroke-width="2.5" filter="url(#scanGlow)"/>
  
  <!-- Status Badge on Screen -->
  <rect x="400" y="270" width="110" height="24" rx="12" fill="#059669" fill-opacity="0.9"/>
  <text x="455" y="286" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">MATCH 99.8%</text>

  <!-- Kiosk Base Stand -->
  <rect x="440" y="410" width="30" height="60" fill="#334155"/>
  <ellipse cx="455" cy="470" rx="65" ry="14" fill="#1E293B"/>

  <!-- Student Figure (Foreground) -->
  <!-- Student Body & Uniform -->
  <path d="M 170 340 L 150 490 L 310 490 L 290 340 Z" fill="url(#vestGrad)"/>
  <!-- White School Shirt Collar -->
  <polygon points="230,320 200,380 230,400 260,380" fill="url(#uniformGrad)"/>
  <!-- School Tie / Badge -->
  <polygon points="226,380 234,380 238,440 230,455 222,440" fill="#DC2626"/>
  <!-- Shoulders -->
  <path d="M 150 350 Q 230 330 310 350 L 320 480 L 140 480 Z" fill="url(#vestGrad)" opacity="0.95"/>
  <path d="M 140 370 Q 180 345 220 350 L 210 480 L 130 480 Z" fill="#1E3A8A"/>

  <!-- Neck -->
  <rect x="215" y="290" width="30" height="35" rx="6" fill="#FBD5BD"/>
  
  <!-- Head & Face -->
  <ellipse cx="230" cy="240" rx="46" ry="58" fill="#FBD5BD"/>
  <!-- Ears -->
  <circle cx="182" cy="242" r="10" fill="#F6C2A5"/>
  <circle cx="278" cy="242" r="10" fill="#F6C2A5"/>

  <!-- Hair (Neat School Cut) -->
  <path d="M 180 230 Q 185 170 230 168 Q 275 170 280 230 Q 260 195 230 198 Q 200 195 180 230 Z" fill="#1E293B"/>
  <path d="M 180 220 Q 195 180 235 182 Q 255 182 278 200 Q 250 178 225 178 Q 195 180 180 220 Z" fill="#334155"/>

  <!-- Facial Features -->
  <!-- Eyebrows -->
  <path d="M 205 218 Q 216 215 224 218" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 236 218 Q 244 215 255 218" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes -->
  <ellipse cx="214" cy="227" rx="5" ry="4" fill="#0F172A"/>
  <circle cx="215" cy="225" r="1.5" fill="#FFFFFF"/>
  <ellipse cx="246" cy="227" rx="5" ry="4" fill="#0F172A"/>
  <circle cx="247" cy="225" r="1.5" fill="#FFFFFF"/>
  <!-- Nose -->
  <path d="M 230 226 L 227 242 H 234" fill="none" stroke="#E2A687" stroke-width="2" stroke-linecap="round"/>
  <!-- Smiling Mouth -->
  <path d="M 218 258 Q 230 270 242 258" fill="none" stroke="#C2410C" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Holographic Biometric Scan Bracket on Student Face -->
  <g filter="url(#scanGlow)">
    <path d="M 172 195 H 188 V 211" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 288 195 H 272 V 211" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 172 295 H 188 V 279" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <path d="M 288 295 H 272 V 279" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
    <!-- Center scanning bar -->
    <line x1="175" y1="245" x2="285" y2="245" stroke="#22D3EE" stroke-width="2" stroke-dasharray="6 4"/>
  </g>

  <!-- Floating Success Verification Card (Top Left of Student) -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="80" width="195" height="76" rx="16" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="74" cy="118" r="20" fill="#ECFDF5"/>
    <path d="M 66 118 L 72 124 L 83 112" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="110" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700">Presensi Berhasil</text>
    <text x="104" y="126" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600">06:58 WIB &bull; Hadir Tepat</text>
    <text x="104" y="141" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Kelas XII MIPA 1</text>
  </g>

  <!-- Floating Speed Metric Card (Bottom Center) -->
  <g filter="url(#cardShadow)">
    <rect x="250" y="380" width="180" height="64" rx="14" fill="#FFFFFF" stroke="#DBEAFE" stroke-width="1.5"/>
    <circle cx="282" cy="412" r="16" fill="#EFF6FF"/>
    <path d="M 282 404 V 412 L 287 415" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <text x="308" y="407" fill="#64748B" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="600">KECEPATAN SCAN</text>
    <text x="308" y="426" fill="#2563EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800">&lt; 0.8 Detik</text>
  </g>
</svg>

