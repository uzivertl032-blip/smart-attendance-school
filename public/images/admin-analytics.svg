<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="adminBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="chartBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="500" height="350" rx="20" fill="url(#adminBg)"/>

  <!-- Main Executive Dashboard Glass Card -->
  <g filter="url(#softShadow)">
    <rect x="40" y="35" width="420" height="270" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>

  <!-- Top bar of the simulated dashboard window -->
  <rect x="40" y="35" width="420" height="38" rx="16" fill="#F8FAFC"/>
  <rect x="40" y="55" width="420" height="18" fill="#F8FAFC"/>
  <line x1="40" y1="73" x2="460" y2="73" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Window buttons -->
  <circle cx="62" cy="54" r="5" fill="#EF4444"/>
  <circle cx="78" cy="54" r="5" fill="#F59E0B"/>
  <circle cx="94" cy="54" r="5" fill="#10B981"/>
  <!-- Search/Title bar -->
  <rect x="130" y="44" width="200" height="20" rx="6" fill="#FFFFFF" stroke="#E2E8F0"/>
  <circle cx="142" cy="54" r="4" fill="none" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Left Side: Bar Chart & Line Chart -->
  <!-- Stat summary pill 1 -->
  <rect x="60" y="90" width="115" height="52" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text x="72" y="108" fill="#2563EB" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">TOTAL SISWA</text>
  <text x="72" y="130" fill="#1E3A8A" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">1.250</text>

  <!-- Stat summary pill 2 -->
  <rect x="185" y="90" width="115" height="52" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text x="197" y="108" fill="#059669" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700">HADIR HARI INI</text>
  <text x="197" y="130" fill="#065F46" font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="800">98.4%</text>

  <!-- Chart Canvas area -->
  <rect x="60" y="155" width="240" height="130" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <!-- Grid lines -->
  <line x1="80" y1="180" x2="280" y2="180" stroke="#E2E8F0" stroke-dasharray="3 3"/>
  <line x1="80" y1="210" x2="280" y2="210" stroke="#E2E8F0" stroke-dasharray="3 3"/>
  <line x1="80" y1="240" x2="280" y2="240" stroke="#E2E8F0" stroke-dasharray="3 3"/>
  <!-- Chart Line Area -->
  <path d="M 80 250 Q 110 210 140 230 T 200 180 T 260 165 L 260 260 L 80 260 Z" fill="url(#chartBlue)"/>
  <path d="M 80 250 Q 110 210 140 230 T 200 180 T 260 165" fill="none" stroke="#2563EB" stroke-width="3" stroke-linecap="round"/>
  <circle cx="200" cy="180" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
  <circle cx="260" cy="165" r="4" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>

  <!-- Right Side: Donut / Status Radial -->
  <rect x="315" y="90" width="130" height="195" rx="10" fill="#F8FAFC" stroke="#E2E8F0"/>
  <text x="380" y="112" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="700" text-anchor="middle">STATUS HARIAN</text>
  <!-- Donut Ring -->
  <circle cx="380" cy="170" r="40" fill="none" stroke="#E2E8F0" stroke-width="12"/>
  <circle cx="380" cy="170" r="40" fill="none" stroke="#10B981" stroke-width="12" stroke-dasharray="190 250" stroke-dashoffset="60"/>
  <circle cx="380" cy="170" r="40" fill="none" stroke="#F59E0B" stroke-width="12" stroke-dasharray="35 250" stroke-dashoffset="-130"/>
  <text x="380" y="174" fill="#0F172A" font-family="'Plus Jakarta Sans', sans-serif" font-size="15" font-weight="800" text-anchor="middle">98%</text>

  <!-- Legend -->
  <circle cx="335" cy="235" r="4" fill="#10B981"/>
  <text x="345" y="238" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Tepat Waktu</text>
  <circle cx="335" cy="255" r="4" fill="#F59E0B"/>
  <text x="345" y="258" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Terlambat</text>
  <circle cx="335" cy="275" r="4" fill="#EF4444"/>
  <text x="345" y="278" fill="#475569" font-family="'Plus Jakarta Sans', sans-serif" font-size="10">Izin/Sakit</text>
</svg>

