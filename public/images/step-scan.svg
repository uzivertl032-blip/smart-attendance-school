<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="st1-grad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EFF6FF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="24" fill="url(#st1-grad)"/>
  
  <!-- Camera Bracket Target / Viewfinder -->
  <path d="M 40 55 L 40 40 L 55 40" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 55 L 120 40 L 105 40" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 40 105 L 40 120 L 55 120" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 120 105 L 120 120 L 105 120" stroke="#2563EB" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Center Face Outline -->
  <circle cx="80" cy="74" r="26" fill="#FFFFFF" stroke="#3B82F6" stroke-width="2.5"/>
  <!-- Eyes -->
  <circle cx="72" cy="70" r="3" fill="#1E293B"/>
  <circle cx="88" cy="70" r="3" fill="#1E293B"/>
  <!-- Smile -->
  <path d="M 74 81 Q 80 87, 86 81" stroke="#2563EB" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Scanning Laser Line with Glow -->
  <line x1="36" y1="74" x2="124" y2="74" stroke="#00E5FF" stroke-width="2" stroke-linecap="round"/>
  <line x1="45" y1="74" x2="115" y2="74" stroke="#00E5FF" stroke-width="5" stroke-opacity="0.35" stroke-linecap="round"/>

  <!-- Step Number Badge -->
  <circle cx="134" cy="26" r="14" fill="#2563EB"/>
  <text x="134" y="31" fill="#FFFFFF" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" text-anchor="middle">1</text>
</svg>

